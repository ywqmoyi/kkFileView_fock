name: build kkfileview arm64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 解决 aspose-cad 被阿里云镜像拦截的问题
      - name: Configure Maven mirrors
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>*,!aspose-maven-repository</mirrorOf>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>aspose</id>
                <repositories>
                  <repository>
                    <id>aspose-maven-repository</id>
                    <url>https://repository.aspose.com/repo/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>aspose</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build dist package
        run: mvn clean package -DskipTests -B

      - name: Verify tar.gz exists
        run: ls -lh server/target/kkFileView-5.0.3.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kkfileview:5.0.3-arm64
            ghcr.io/${{ github.repository_owner }}/kkfileview:latest
          cache-from: type=gha,scope=kkfileview
          cache-to: type=gha,scope=kkfileview,mode=max

      - name: Verify image arch
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/kkfileview:5.0.3-arm64
